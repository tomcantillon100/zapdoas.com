<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g stroke="#1b1b2f" stroke-width="3" stroke-linejoin="round">
    <!-- tail -->
    <polygon points="70,150 85,192 100,158 115,192 130,150" fill="#ffd23f"/>
    <!-- wings -->
    <polygon points="72,88 10,38 36,74 0,80 30,100 5,126 46,114 72,122" fill="#ffd23f"/>
    <polygon points="128,88 190,38 164,74 200,80 170,100 195,126 154,114 128,122" fill="#ffd23f"/>
    <!-- body -->
    <ellipse cx="100" cy="112" rx="34" ry="46" fill="#ffd23f"/>
    <!-- belly -->
    <ellipse cx="100" cy="122" rx="18" ry="28" fill="#fff0a8" stroke="none"/>
    <!-- crest -->
    <polygon points="82,44 88,12 98,38 106,8 112,38 124,16 118,46" fill="#ffd23f"/>
    <!-- head -->
    <circle cx="100" cy="60" r="23" fill="#ffd23f"/>
    <!-- beak -->
    <polygon points="91,68 109,68 100,86" fill="#f08a24"/>
  </g>
  <!-- eyes -->
  <circle cx="91" cy="58" r="4" fill="#1b1b2f"/>
  <circle cx="109" cy="58" r="4" fill="#1b1b2f"/>
  <circle cx="92" cy="57" r="1.3" fill="#fff"/>
  <circle cx="110" cy="57" r="1.3" fill="#fff"/>
  <!-- feet -->
  <g stroke="#f08a24" stroke-width="4" stroke-linecap="round">
    <line x1="88" y1="156" x2="82" y2="168"/>
    <line x1="112" y1="156" x2="118" y2="168"/>
  </g>
</svg>
