<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies - Zapdoas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="logo" href="index.html">⚡ ZAPDOAS</a>
    <ul>
      <li><a class="link" href="index.html">Home</a></li>
      <li><a class="link" href="about.html">About</a></li>
      <li><a class="link active" href="movies.html">Movies</a></li>
      <li><a class="link" href="play.html">Play</a></li>
    </ul>
  </nav>

  <main>
    <h2>Movies</h2>
    <input class="search" id="search" type="search" placeholder="Search my movies...">
    <div id="list"></div>
  </main>

  <footer>A personal, non-commercial fan site. Not affiliated with or endorsed by The Pokémon Company or Nintendo.</footer>

  <img id="zapdos" src="zapdos.svg" alt="Zapdos. Click me!" title="Click me!">
  <div id="flash"></div>

  <script>
    // EDIT THIS LIST. Add a line for each movie: title, year, rating (1-5), note.
    const movies = [
      { title: "Example Movie One", year: 2010, rating: 5, note: "Replace me with a real film" },
      { title: "Example Movie Two", year: 1999, rating: 4, note: "Add your own notes here" },
      { title: "Example Movie Three", year: 2021, rating: 3, note: "Still on my watch list" }
    ];

    const list = document.getElementById("list");
    const search = document.getElementById("search");

    function show(items) {
      list.innerHTML = "";
      if (!items.length) {
        list.innerHTML = "<p style='color:#9aa6d6'>No movies found.</p>";
        return;
      }
      items.forEach(m => {
        const div = document.createElement("div");
        div.className = "movie";
        const left = document.createElement("div");
        const h = document.createElement("h3");
        h.textContent = m.title + " (" + m.year + ")";
        const s = document.createElement("small");
        s.textContent = m.note;
        left.append(h, s);
        const stars = document.createElement("div");
        stars.className = "stars";
        stars.textContent = "★".repeat(m.rating) + "☆".repeat(5 - m.rating);
        div.append(left, stars);
        list.append(div);
      });
    }

    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      show(movies.filter(m => m.title.toLowerCase().includes(q) || m.note.toLowerCase().includes(q)));
    });
    show(movies);

    const bird = document.getElementById("zapdos");
    const flash = document.getElementById("flash");
    bird.addEventListener("click", () => {
      bird.classList.remove("zap");
      void bird.offsetWidth;
      bird.classList.add("zap");
      flash.classList.add("on");
      setTimeout(() => flash.classList.remove("on"), 90);
      setTimeout(() => bird.classList.remove("zap"), 450);
    });
  </script>
</body>
</html>
