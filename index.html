<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy me a coffee</title>
    <style>
        body {
            background-color: grey;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
        }

        .theyellowbox {
            background-color: lemonchiffon;
            color: #243047;
            padding: 20px;
            border-radius: 10px;
            box-sizing: border-box;

        img {
            display: block;
            width: 100%;

            height: auto;
            margin: 0 auto;
            border-radius: 8px;
        }

</head>

<body>
    <main>
        <section class="theyellowbox">
            <img src="https://erthcloud.com/tom.jpeg" alt="Computer science wiring diagram">
        </section>
    </main>

</html>
