
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome Home</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    color: #aaa;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  h1 { color: #ddd; letter-spacing: 4px; animation: flicker 4s infinite; }
  p { max-width: 420px; text-align: center; line-height: 1.5; }
  button {
    background: transparent;
    color: #ccc;
    border: 1px solid #555;
    padding: 12px 28px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { border-color: #b00000; color: #fff; }

  #scare {
    display: none;
    position: fixed;
    inset: 0;
    background: #b00000;
    color: #fff;
    font-size: 15vw;
    font-weight: bold;
    align-items: center;
    justify-content: center;
    text-shadow: 0 0 30px #000;
  }
  .shake { animation: shake 0.2s infinite; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
    52% { opacity: 1; }
    54% { opacity: 0.3; }
  }
  @keyframes shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-8px, 4px); }
    50% { transform: translate(6px, -6px); }
    75% { transform: translate(-4px, -2px); }
    100% { transform: translate(0, 0); }
  }
</style>
</head>
<body>
<h1>WELCOME HOME</h1>
<p>You've been expected for a long time.<br>Make yourself comfortable.</p>
<button id="enter">Enter</button>

<div id="scare">BOO!</div>

<script>
  const enter = document.getElementById("enter");
  const scare = document.getElementById("scare");

  enter.addEventListener("click", () => {
    enter.textContent = "Just a moment...";
    enter.disabled = true;

    setTimeout(() => {
      scare.style.display = "flex";
      scare.classList.add("shake");

      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = 80;
        gain.gain.value = 0.5;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) { /* audio not supported */ }

      setTimeout(() => {
        scare.style.display = "none";
        scare.classList.remove("shake");
        enter.textContent = "Enter";
        enter.disabled = false;
      }, 2000);
    }, 2500 + Math.random() * 3000);
  });
</script>
</body>
</html>
